<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="VOCABULARY — 10,000 词主动回忆与间隔重复记忆系统">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VOCABULARY">
<title>VOCABULARY</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:#090a0d;color:#eef2f7}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center}
button,input{font:inherit}
button{cursor:pointer}
#app{width:100%;max-width:620px;min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}
.topbar{height:68px;padding:17px 18px 9px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:18px;font-weight:780;letter-spacing:3px}
.brand span{color:#79a9ff}
.top-meta{display:flex;align-items:center;gap:8px}
.streak{font-size:12px;color:#a5adbc;background:#11141a;border:1px solid #252a34;padding:7px 12px;border-radius:999px}

.sync-dot{width:8px;height:8px;border-radius:50%;background:#39d98a;box-shadow:0 0 0 4px rgba(57,217,138,.08);cursor:pointer}
.sync-dot.off{background:#4a5262;box-shadow:0 0 0 4px rgba(120,130,150,.08)}
.sync-dot.busy{background:#4f8cff;box-shadow:0 0 0 4px rgba(79,140,255,.12)}
.sync-dot.err{background:#ff6b6b;box-shadow:0 0 0 4px rgba(255,107,107,.12)}
.acct-status{font-size:12.5px;line-height:1.7;color:#9aa4b4;margin-bottom:4px}
.acct-input{width:100%;background:#141922;border:1px solid #242c38;color:#eef2f7;border-radius:11px;padding:11px 12px;font-size:14px;margin-top:8px}
.acct-input:focus{outline:none;border-color:#3a68c8}
.sql{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.6;background:#0d1016;border:1px solid #242a34;border-radius:10px;padding:10px;color:#9fb3d6;white-space:pre-wrap;word-break:break-word;margin-top:8px;max-height:190px;overflow:auto}
.main{padding:0 15px}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:6px 2px 12px}
.eyebrow{font-size:11px;letter-spacing:1.2px;color:#7f8ba1;text-transform:uppercase}
.page-title{font-size:20px;margin:3px 0 0;font-weight:700}
.muted{font-size:12.5px;line-height:1.75;color:#7f899b}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 13px}
.plan-cell{background:#11141a;border:1px solid #242a34;border-radius:15px;padding:12px 13px}
.plan-cell .k{font-size:10.5px;color:#758093;margin-bottom:4px}
.plan-cell .v{font-size:20px;font-weight:740}
.plan-cell .v small{font-size:11px;color:#6f7889;font-weight:500;margin-left:4px}
.progress{margin:0 2px 12px}
.progress-head{display:flex;justify-content:space-between;font-size:11.5px;color:#7c8798;margin-bottom:6px}
.bar{height:6px;background:#171b22;border-radius:99px;overflow:hidden;border:1px solid #202530}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f8cff,#84aefe);border-radius:99px;transition:width .3s ease}
.card{position:relative;overflow:hidden;background:#11141a;border:1px solid #272d37;border-radius:20px;padding:21px 19px 18px;box-shadow:0 14px 40px rgba(0,0,0,.24)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:10.5px;padding:4px 9px;border-radius:999px;background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.27);color:#8fb4ff}
.pill.dim{background:#181c23;border-color:#252a34;color:#798598}
.phonetic{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#747e90}
.word{font-size:35px;line-height:1.14;letter-spacing:.2px;font-weight:760;margin:3px 0 8px;word-break:break-word}
.pos{font-size:11.5px;color:#7e899b;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meaning{font-size:21px;line-height:1.55;font-weight:650;margin:8px 0 12px}
.meaning .sub{font-size:12px;color:#7f899b;font-weight:450;display:block;margin-top:4px}
.example{font-size:14.5px;line-height:1.85;color:#c1c8d4;background:#171b22;border:1px solid #242a34;border-radius:13px;padding:12px 13px;margin:11px 0;min-height:44px}
.example .blank{color:#88aeff;font-weight:700;letter-spacing:2px}
.source-note{font-size:10.5px;color:#646e80;margin-top:5px;display:block}
.feedback{font-size:13.5px;line-height:1.7;margin-top:12px;min-height:0}
.feedback.ok{color:#53e0a0}
.feedback.bad{color:#ff8383}
.feedback strong{color:#eaf1ff}
.ptt-note{font-size:11px;color:#7f899b;margin-top:3px}
.actions{display:flex;gap:9px;margin-top:14px}
.btn{flex:1;border:none;border-radius:12px;padding:12px 14px;font-weight:650;font-size:14px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn.primary{background:#4f8cff;color:#fff;box-shadow:0 7px 20px rgba(79,140,255,.2)}
.btn.ghost{background:#181c23;color:#bcc4d1;border:1px solid #282e39}
.btn.flat{flex:0 0 auto;background:transparent;color:#8ba9e6;padding:7px 6px;font-size:12.5px}
.btn.danger{background:rgba(247,111,111,.11);color:#ff8686;border:1px solid rgba(247,111,111,.27)}
.actions a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.answer-tools{display:flex;justify-content:flex-end;gap:4px;margin-top:5px}
.head-actions{display:flex;gap:8px;align-items:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:6px 0 2px}
.opt{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;background:#141922;border:1px solid #242c38;color:#dfe6f0;border-radius:13px;padding:12px 13px;font-size:14px;line-height:1.5;transition:.15s;-webkit-tap-highlight-color:transparent;outline:none}
/* 仅在有真实指针的设备上启用 hover 效果：避免触屏点选后「上一题的蓝色选中态」黏在下一题上 */
@media (hover:hover) and (pointer:fine){.opt:hover:not(:disabled){border-color:#3a68c8;background:#171f2c}}
.opt .idx{color:#5f6b7e;font-size:12px;font-weight:700;min-width:14px;padding-top:1px}
.opt .txt{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.opt.word .txt{font-size:16.5px;font-weight:640;letter-spacing:.3px}
.opt.is-correct{border-color:#39d98a;background:rgba(57,217,138,.08)}
.opt.sel-wrong{border-color:#ff6b6b;background:rgba(255,107,107,.09)}
.opt.sel-wrong .idx{color:#ff8383}
.opt:disabled{cursor:default}
.reveal{margin-top:11px;border-top:1px solid #1f252f;padding-top:6px}
.reveal-row{padding:7px 0;border-bottom:1px solid #171d26}
.reveal-row:last-child{border-bottom:0}
.reveal-row .rw{font-size:13.5px;color:#eaf1ff;font-weight:640}
.reveal-row.ok .rw{color:#53e0a0}
.reveal-row.bad .rw{color:#ff8383}
.reveal-row .rz{font-size:12.5px;color:#8b96a8;line-height:1.6;margin-top:2px}
.badge{font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid #2b3442;color:#7f899b;margin-left:7px;font-weight:600}
.badge.ok{border-color:#2f6b51;color:#53e0a0}
.badge.mine{border-color:#8a5a2a;color:#ffbe6b}
.finish{background:#11141a;border:1px solid #272d37;border-radius:20px;padding:44px 22px;text-align:center}
.finish .icon{font-size:38px;margin-bottom:10px;color:#53e0a0}
.finish h2{font-size:21px;margin:4px 0 7px}
.finish p{margin:0;color:#808a9a;line-height:1.7;font-size:13px}
/* 作答弹出字样：答对 pure(蓝) / 答错 lost(红) / 拼写接近或用了提示答对 far(黄)。显示在「选项 / 作答区」那一片 */
.opt-zone{position:relative}
/* 判定字样与 combo 作为同一整体渲染：一起出现、一起消失，动画同步 */
.verdict{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.55);opacity:0;pointer-events:none;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;white-space:nowrap}
.verdict .vd-main{font-size:42px;font-weight:800;letter-spacing:5px}
.verdict .vd-combo{font-size:14px;font-weight:800;letter-spacing:2.5px;color:#ffce4d;text-shadow:0 0 14px rgba(255,206,77,.55)}
.verdict .vd-combo.v-pure{color:#5b9dff;text-shadow:0 0 14px rgba(91,157,255,.6)}
.verdict .vd-combo.v-far{color:#ffce4d;text-shadow:0 0 14px rgba(255,206,77,.6)}
.verdict .vd-combo.v-lost{color:#ff6b6b;text-shadow:0 0 14px rgba(255,107,107,.6)}
.verdict.show{animation:verdictPop 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes verdictPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}16%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}30%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}
.verdict.pure .vd-main{color:#5b9dff;text-shadow:0 0 22px rgba(91,157,255,.8),0 0 4px rgba(91,157,255,.9)}
.verdict.lost .vd-main{color:#ff6b6b;text-shadow:0 0 22px rgba(255,107,107,.8),0 0 4px rgba(255,107,107,.9)}
.verdict.far .vd-main{color:#ffce4d;text-shadow:0 0 22px rgba(255,206,77,.8),0 0 4px rgba(255,206,77,.9)}
/* 一轮结算页：全对 Pure Memory(紫) / 零 lost 但非全对 Full Recall(蓝紫之间) / ≥70% Track Complete(蓝) / <70% Track Lost(红) */
.settle{text-align:center;padding:32px 18px 24px;border-radius:20px;border:1px solid #272d37;background:#11141a;animation:settleIn .38s cubic-bezier(.2,.8,.3,1)}
@keyframes settleIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.settle-eyebrow{font-size:10.5px;letter-spacing:3px;color:#7f8ba1}
.settle-title{font-size:31px;font-weight:800;letter-spacing:.5px;margin:9px 0 7px}
.settle-sub{font-size:12.5px;color:#8b95a6;margin-bottom:20px;line-height:1.6}
.settle-stats{display:flex;justify-content:center;gap:30px;margin-bottom:18px}
.settle-stats b{display:block;font-size:23px;font-weight:750}
.settle-stats b.small{font-size:16px;letter-spacing:.3px}
/* 难度档位配色：PST 蓝 / PRS 绿 / FTR 紫 / BYD 红 / 专有名词 金 */
.cat-PST,.cat-PRS,.cat-FTR,.cat-BYD,.cat-SP{text-shadow:0 0 10px currentColor}
.cat-PST{color:#4f8cff}
.cat-PRS{color:#39d98a}
.cat-FTR{color:#b892ff}
.cat-BYD{color:#ff6b6b}
.cat-SP{color:#ffce4d}
.settle-stats span{font-size:10.5px;color:#6f7a8c}
.settle-note{font-size:11px;color:#6f7a8c;margin-bottom:18px}
.settle-verdicts{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.settle-verdicts .vs{font-size:12px;font-weight:700;letter-spacing:.5px;padding:4px 12px;border-radius:999px;border:1px solid #2a313d;background:#161b23}
.settle-verdicts .vs b{font-weight:800;margin-left:3px}
.settle-verdicts .vs.pure{color:#5b9dff;border-color:rgba(91,157,255,.45);background:rgba(91,157,255,.08)}
.settle-verdicts .vs.far{color:#ffce4d;border-color:rgba(255,206,77,.45);background:rgba(255,206,77,.08)}
.settle-verdicts .vs.lost{color:#ff6b6b;border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.08)}
.settle.pure{border-color:rgba(160,107,255,.55);box-shadow:0 0 40px rgba(160,107,255,.18) inset}
.settle.pure .settle-title{color:#b892ff;text-shadow:0 0 26px rgba(160,107,255,.65)}
.settle.full{border-color:rgba(124,124,255,.55);box-shadow:0 0 40px rgba(124,124,255,.17) inset}
.settle.full .settle-title{color:#9c9dff;text-shadow:0 0 26px rgba(124,124,255,.62)}
.settle.complete{border-color:rgba(79,140,255,.55);box-shadow:0 0 40px rgba(79,140,255,.16) inset}
.settle.complete .settle-title{color:#82b2ff;text-shadow:0 0 26px rgba(79,140,255,.6)}
.settle.lost{border-color:rgba(255,107,107,.55);box-shadow:0 0 40px rgba(255,107,107,.16) inset}
.settle.lost .settle-title{color:#ff9090;text-shadow:0 0 26px rgba(255,107,107,.6)}
/* 结算分数与评级 */
.settle-score{display:flex;align-items:center;justify-content:center;gap:11px;margin:2px 0 16px}
.settle-score b{font-size:33px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.settle-score .grade{font-size:15px;font-weight:800;padding:3px 12px;border-radius:9px;border:1px solid #2b3442;background:#161b23;letter-spacing:1px}
.grade.gEXplus{color:#ff8ad4;border-color:rgba(255,138,212,.5);background:rgba(255,138,212,.1)}
.grade.gEX{color:#ffce4d;border-color:rgba(255,206,77,.5);background:rgba(255,206,77,.1)}
.grade.gAA{color:#ff9f5b;border-color:rgba(255,159,91,.5);background:rgba(255,159,91,.1)}
.grade.gA{color:#8ee07a;border-color:rgba(142,224,122,.5);background:rgba(142,224,122,.1)}
.grade.gB{color:#5b9dff;border-color:rgba(91,157,255,.5);background:rgba(91,157,255,.1)}
.grade.gC{color:#b892ff;border-color:rgba(184,146,255,.5);background:rgba(184,146,255,.1)}
.grade.gD{color:#ff6b6b;border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.1)}
/* 本轮单词回看 */
.round-review{margin-top:14px;border-top:1px solid #1f252f;padding-top:8px;text-align:left;max-height:330px;overflow:auto}
.round-review .rr-row{display:flex;gap:8px;align-items:baseline;padding:7px 2px;border-bottom:1px solid #171d26}
.rr-word{font-size:14px;font-weight:650;color:#eaf1ff;min-width:92px}
.rr-zh{font-size:12px;color:#8b96a8;flex:1;line-height:1.5}
.rr-badge{font-size:10px;font-weight:800;letter-spacing:.5px;padding:1px 7px;border-radius:99px;border:1px solid #2b3442;white-space:nowrap}
.rr-badge.pure{color:#5b9dff;border-color:rgba(91,157,255,.45);background:rgba(91,157,255,.08)}
.rr-badge.far{color:#ffce4d;border-color:rgba(255,206,77,.45);background:rgba(255,206,77,.08)}
.rr-badge.lost{color:#ff6b6b;border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:#11141a;border:1px solid #252b35;border-radius:15px;padding:15px}
.stat .k{font-size:10.5px;color:#737e90}
.stat .v{font-size:25px;font-weight:760;margin-top:5px}
.stat .v small{font-size:11px;color:#6c7687;font-weight:500;margin-left:4px}
.panel{background:#11141a;border:1px solid #252b35;border-radius:17px;padding:15px;margin-top:10px}
.panel-title{font-size:13.5px;font-weight:680;margin-bottom:9px}
.dist{display:flex;align-items:center;gap:8px;margin:8px 0}
.dist .lab{width:62px;font-size:10.5px;color:#7c8798}
.dist .track{flex:1;height:7px;border-radius:99px;background:#181c23;overflow:hidden}
.dist .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f8cff,#83aaff)}
.dist .num{width:46px;text-align:right;font-size:10.5px;color:#727d90}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{background:#181c23;border:1px solid #252b35;border-radius:10px;padding:8px 0;text-align:center}
.day .d{font-size:9.5px;color:#737e90}
.day .v{font-size:12px;margin-top:4px;color:#475061}
.day.on{background:rgba(57,217,138,.08);border-color:rgba(57,217,138,.28)}
.day.on .v{color:#53e0a0}
.weak-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #1f242d}
.weak-row:first-of-type{border-top:none}
.weak-word{font-size:13.5px;font-weight:650}
.weak-meta{font-size:10.5px;color:#717b8d}
.choice-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.choice{padding:10px 4px;border-radius:10px;background:#171b22;border:1px solid #282e39;color:#8993a5;font-size:11.5px}
.choice small{display:block;font-size:10px;opacity:.7;margin-top:2px;font-weight:400}
.choice.on{background:#4f8cff;border-color:#4f8cff;color:#fff}
.range-row{display:flex;gap:10px;align-items:center}
.range{flex:1;accent-color:#4f8cff}
.range-val{width:62px;text-align:right;color:#8fb4ff;font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.switch{appearance:none;width:42px;height:24px;border-radius:999px;background:#262c35;position:relative;outline:none;border:none}
.switch:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8a93a3;transition:.18s}
.switch:checked{background:#4f8cff}
.switch:checked:before{left:21px;background:#fff}
.source-box{background:#0d1015;border:1px solid #222832;border-radius:12px;padding:11px 12px;color:#727c8d;font-size:11px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:#212632;color:#eef2f7;border:1px solid #303743;padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.error-box{position:fixed;left:12px;right:12px;top:12px;z-index:90;background:#3a1517;border:1px solid #6c282d;color:#ffc3c6;padding:11px 13px;border-radius:12px;font-size:11.5px;line-height:1.5;white-space:pre-wrap}
.empty{text-align:center;padding:50px 18px;color:#727c8d}
.tiny{font-size:10.5px;color:#7f8ba1;line-height:1.65}
.kbd{display:inline-block;border:1px solid #2c333f;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:10px;color:#8d97a8;background:#161a21}
.pron-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 6px}
.pron{display:inline-flex;align-items:center;gap:6px;background:#171b22;border:1px solid #282e39;color:#c3cbd8;border-radius:10px;padding:7px 11px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pron b{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-weight:700;font-size:11px;color:#8fb4ff}
.pron.active{border-color:#4f8cff;background:rgba(79,140,255,.12);color:#eaf1ff}
.pron.empty{opacity:.5}
.pron-hint{font-size:10.5px;color:#5f6a7c}
.detail{margin-top:12px;background:#0f1319;border:1px solid #232a34;border-radius:13px;padding:12px 13px}
.detail-row{display:flex;gap:10px;font-size:12.5px;line-height:1.7;padding:4px 0;border-top:1px solid #1b2129}
.detail-row:first-child{border-top:none}
.detail-row .k{flex:0 0 56px;color:#6f7a8c}
.detail-row .v{flex:1;color:#c7cfdb;word-break:break-word}
.detail-row .ac{color:#8fb4ff;font-size:11px;margin-right:4px}
.choice-grid.two{grid-template-columns:1fr 1fr}
.choice-grid.two .wide{grid-column:span 2}
.choice-grid.ten{grid-template-columns:repeat(6,1fr)}
.choice.proper{white-space:nowrap;font-size:10.5px;color:#c9b3ff;border-color:#3a3150}
.choice.proper.on{background:#7c5cff;border-color:#7c5cff;color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#11141a;border:1px solid #242a34;border-radius:13px;padding:4px;margin:0 0 10px}
.seg button{border:none;background:transparent;color:#8b95a6;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600}

  var L=LIST_BY_KEY[listKey(catKey,idx)];if(!L){toast('list 不存在');return}
  var v=diffVal(L.key);
  var band=L.band;
  var words=L.words||[];
  mode=mode||listSel.mode||'auto';
  if(!words.length){toast('该难度暂无单词');return}
  if(!clearSessionIfAny('当前学习还没完成，重新开始？'))return;
  var q=shuffle(words.map(function(w){var r=state.words[w];return {w:w,kind:(r&&r.seen>0?'review':'new')}}));
  beginSession(q,'开始：'+L.catName+' · Lv.'+(L.lv!=null?L.lv:'?')+(hard?' · 困难模式':'')+(mode&&mode!=='auto'?' · '+modeLabel(mode).split(' · ')[0]:''),
    {type:'list',catKey:catKey,catName:L.catName,idx:idx,key:L.key,ckey:chartKey(L.key),band:band,v:(v==null?null:v),nodiff:!!L.nodiff,hard:!!hard,mode:mode});
}
/* 回忆模式：自选难度档、单词数与题型；记录只保留最近 10 次 */
function startRecall(band,count,hard,mode){
  if(mode==='listen'&&state.settings.mute)mode='auto';
  var pool=(BAND_WORDS[band]||[]).map(function(w){return MAP[w]}).filter(Boolean);
  if(!pool.length){toast('该难度暂无单词');return}
  if(!clearSessionIfAny('当前学习还没完成，重新开始？'))return;
  var picked=shuffle(pool).slice(0,Math.min(count,pool.length));
  var sum=0;picked.forEach(function(d){sum+=diffVal(LIST_OF[d.w],band)||0});
  var v=picked.length?sum/picked.length:0;
  var q=picked.map(function(d){return {w:d.w,kind:'new'}});
  beginSession(q,'回忆模式 · '+band+' '+dispDiff(v)+' · '+q.length+' 词'+(hard?' · 困难模式':''),
    {type:'recall',band:band,v:v,ckey:'recall:'+band,hard:!!hard,mode:mode||'auto'});
}
/* 错题强化：把个人高频错误词单独组一轮强化复习（错误次数多、熟练度低者优先） */
function mistakeWords(limit){
  var arr=[];
  Object.keys(state.words).forEach(function(w){
    var r=state.words[w],d=MAP[w];if(!d||!(r.seen>0))return;
    var wrong=(r.meaningWrong||0)+(r.productionWrong||0);
    if(!wrong)return;
    arr.push({w:w,wrong:wrong,prof:proficiency(r)});
  });
  arr.sort(function(a,b){return b.wrong-a.wrong||a.prof-b.prof});
  return arr.slice(0,limit||50).map(function(x){return x.w});
}
function startMistakes(hard){
  var ws=mistakeWords(50);
  if(!ws.length){toast('暂无错题，继续练习吧');return}
  if(!clearSessionIfAny('当前学习还没完成，重新开始？'))return;
  var q=ws.map(function(w){return {w:w,kind:'review'}});
  beginSession(q,'错题强化 · '+q.length+' 词'+(hard?' · 困难模式':''),{type:'mistakes',hard:!!hard,mode:'auto'});
}
function currentData(){return session&&session.queue.length?MAP[session.queue[0].w]:null}
function currentRec(){var d=currentData();return d?userRec(d.w):null}
function exitStudy(){
  if(session&&session.queue.length&&!confirm('退出将结束本轮（进度已自动保存），确定退出？'))return;
  var ctx=(session&&session.ctx)||lastCtx||{};
  session=null;phase='question';
  if(ctx.type==='recall')showView('recall');
  else if(ctx.type==='mistakes')showView('stats');
  else if(ctx.type==='due')showView('home');
  else if(ctx.catKey){curCatKey=ctx.catKey;showView('lists')}
  else showView('home');
}

/* ---------- 今日待复习（按遗忘曲线到期聚合，以每天早上 8 点为刷新界） ---------- */
/* 某 List 当前所有到期单词（seen>0 且 dueAt 已过最近一次早上 8 点） */
function dueWordsOfList(key){
  var L=LIST_BY_KEY[key];if(!L)return [];
  var t=reviewCutoff();
  return (L.words||[]).filter(function(w){
    var r=state.words[w];
    /* 只统计归属本 List 的记录（r.src），共用词不会重复出现在其他 List 的待复习里 */
    var src=r&&r.src?r.src:(KEYS_OF[w]||[])[0];
    return r&&r.seen>0&&(r.dueAt||0)<=t&&src===key;
  });
}
/* 聚合出「有到期单词」的 List，按待复习词数从多到少排列 */
function dueListsInfo(){
  var out=[];
  Object.keys(LIST_BY_KEY).forEach(function(key){
    var n=dueWordsOfList(key).length;
    if(!n)return;
    var L=LIST_BY_KEY[key];
    out.push({key:key,catKey:L.catKey,catName:L.catName,idx:L.idx,band:L.band,diff:L.diff,nodiff:!!L.nodiff,count:n});
  });
  out.sort(function(a,b){return b.count-a.count||(a.catName<b.catName?-1:a.catName>b.catName?1:0)||a.idx-b.idx});
  return out;
}
/* 首页「今日待复习」面板：复习完该 List 的到期词后，本面板会自动消失 */
function dueListsHtml(){
  var arr=dueListsInfo();
  if(!arr.length)return '';
  var total=0;arr.forEach(function(x){total+=x.count});
  return '<div class="panel due-panel"><div class="panel-title">今日待复习 · '+total+' 词</div>'+
    '<div class="lt-group"><span class="lt-label">题型</span><div class="rec-grid" id="dueMode">'+
      rcModes().map(function(m){return '<button type="button" data-mode="'+m.k+'" class="'+(listSel.mode===m.k?'on':'')+'">'+m.n+'</button>'}).join('')+
    '</div></div>'+
    arr.map(function(x){
      return '<div class="due-row"><div class="due-main"><div class="due-t">'+escapeHtml(x.catName)+' · List '+(x.idx+1)+' <span class="bandtag cat-'+x.band+'">'+escapeHtml(x.band)+'</span></div><div class="due-s">'+x.count+' 词待复习</div></div>'+
        '<button class="btn primary due-go" data-due="'+escapeHtml(x.key)+'" type="button">复习</button></div>';
    }).join('')+'</div>';
}
/* 复习某个 List 的全部到期单词（不写谱面、不进 PTT，但成绩计入该 List 并参与最高成绩） */
function startDueList(key){
  var L=LIST_BY_KEY[key];if(!L){toast('List 不存在');return}
  var words=dueWordsOfList(key);
  if(!words.length){toast('该 List 暂无到期单词');return}
  if(!clearSessionIfAny('当前学习还没完成，重新开始？'))return;
  var q=shuffle(words).map(function(w){return {w:w,kind:'review'}});
  beginSession(q,'复习到期 · '+L.catName+' List '+(L.idx+1)+' · '+q.length+' 词',
    {type:'due',catKey:L.catKey,catName:L.catName,idx:L.idx,key:key,ckey:key,band:L.band,v:L.diff==null?null:L.diff,nodiff:!!L.nodiff,mode:listSel.mode||'auto'});
}
/* 该 List 是否有可重置的数据（成绩 / 谱面 / 词条记忆记录） */
function listHasRecord(key){
  if((state.lists&&state.lists[key])||(state.charts&&state.charts[key]))return true;
  var L=LIST_BY_KEY[key];if(!L)return false;
  var ws=L.words||[];
  for(var i=0;i<ws.length;i++){var r=state.words[ws[i]];if(r&&r.seen>0)return true}
  return false;
}
/* 把某个 List 重置为最初状态：抹除该 List 的成绩、谱面与其中的词条记忆记录 */
function resetList(key){
  var L=LIST_BY_KEY[key];if(!L){toast('List 不存在');return}
  var words=L.words||[];
  if(state.lists)delete state.lists[key];
  if(state.charts)delete state.charts[key];
  var cleared=0;
  words.forEach(function(w){
    if(!state.words[w])return;
    delete state.words[w];cleared++;
  });
  save();
  if(curCatKey===L.catKey)renderLists();
  toast('已重置 '+L.catName+' List '+(L.idx+1)+'：清除 '+cleared+' 词记录');
}
/* 结算页「再过一遍」：用本轮相同的单词与模式重新开始一轮 */
function restartRound(){
  if(!lastRound)return;
  var ctx=Object.assign({},lastRound.ctx||{});
  delete ctx.__seenEn2zh;   /* 丢弃上一轮的选项去重集合，避免复用导致误判 */
  var words=(lastRound.log||[]).map(function(x){return x.w}).filter(function(w){return MAP[w]});
  if(!words.length){toast('没有可重玩的单词');return}
  var q=shuffle(words).map(function(w){var r=state.words[w];return {w:w,kind:(r&&r.seen>0?'review':'new')}});
  beginSession(q,'再过一遍 · '+q.length+' 词',ctx);
}

  if(d.sen)rows+='<div class="detail-row"><span class="k">例句</span><span class="v">'+sentenceHighlight(d.sen,d.w)+'</span></div>';
  if(d.def)rows+='<div class="detail-row"><span class="k">英文释义</span><span class="v">'+escapeHtml(d.def)+'</span></div>';
  if(d.ex)rows+='<div class="detail-row"><span class="k">词形变化</span><span class="v">'+escapeHtml(d.ex)+'</span></div>';
  return rows;
}
function searchWords(q){
  q=(q||'').trim().toLowerCase();
  if(!q)return [];
  var out=[];
  for(var i=0;i<WORDS.length&&out.length<60;i++){
    var d=WORDS[i],lw=d.w.toLowerCase();
    if(lw.indexOf(q)<0&&(!d.zh||d.zh.indexOf(q)<0)&&(!d.core||d.core.indexOf(q)<0))continue;
    out.push({d:d,rank:lw===q?0:(lw.indexOf(q)===0?1:2)});
  }
  out.sort(function(a,b){return a.rank-b.rank||a.d.w.length-b.d.w.length||(a.d.w<b.d.w?-1:1)});
  return out.slice(0,60).map(function(x){return x.d});
}
function runSearch(q){
  var box=$('searchResults');if(!box)return;
  if(!(q||'').trim()){box.innerHTML='<div class="tiny">输入关键词开始搜索（支持英文单词或中文释义）。</div>';return}
  var res=searchWords(q);
  if(!res.length){box.innerHTML='<div class="tiny">没有匹配的词。</div>';return}
  box.innerHTML=res.map(function(d,i){
    return '<div class="search-item" data-i="'+i+'"><button class="search-row" type="button"><b>'+escapeHtml(d.w)+'</b><span class="si-zh">'+escapeHtml(d.core||shortMeaning(d.zh,d.pos))+'</span></button><div class="detail-box hidden"></div></div>';
  }).join('');
  box.querySelectorAll('.search-item').forEach(function(item){
    var d=res[+item.dataset.i];
    item.querySelector('.search-row').onclick=function(){
      var db=item.querySelector('.detail-box');
      if(!db.classList.contains('hidden')){db.classList.add('hidden');return}
      db.innerHTML=wordDetailHtml(d);db.classList.remove('hidden');
    };
  });
}

/* 移动端手势：右滑「继续」（仅在触屏设备上生效） */
function bindGestures(){
  var host=$('study-card');if(!host||host.__gesture)return;host.__gesture=1;
  var x0=0,y0=0,dx=0,dy=0,active=false;
  host.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    var t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=0;dy=0;active=true;
  },{passive:true});
  host.addEventListener('touchmove',function(e){
    if(!active)return;

/* ---------- 选择题：索引与选项 ---------- */
function bigrams(s){var set={},n=0;for(var i=0;i<s.length-1;i++){var g=s.slice(i,i+2);if(!set[g]){set[g]=1;n++}}return {set:set,n:n}}
function diceCoeff(a,b){if(!a||!b)return 0;if(a===b)return 1;if(a.length<2||b.length<2)return 0;var A=bigrams(a),B=bigrams(b),inter=0;for(var g in A.set){if(B.set[g])inter++}return 2*inter/(A.n+B.n)}
function buildIndex(){BYLV={};BYINIT={};BYBAND={PST:[],PRS:[],FTR:[],BYD:[]};WORDS.forEach(function(d){(BYLV[d.baseLv]=BYLV[d.baseLv]||[]).push(d);var k=(d.w[0]||'').toLowerCase();(BYINIT[k]=BYINIT[k]||[]).push(d);(BYBAND[bandOf(d.baseLv)]||[]).push(d)})}
/* 难度档位（PST/PRS/FTR/BYD）：与 diffCat 保持一致 */
function bandOf(lv){lv=+lv||1;return lv<=3?'PST':lv<=6?'PRS':lv<=10?'FTR':'BYD'}
/* 形近词：同首字母、长度接近、字符二元组相似度达到阈值的词 */
function similarEn(word,k,minScore){
  minScore=minScore==null?0.3:minScore;
  var pool=BYINIT[(word[0]||'').toLowerCase()]||[],scored=[];
  for(var i=0;i<pool.length;i++){var x=pool[i];if(x.w===word)continue;
    var s=diceCoeff(word,x.w)-Math.abs(x.w.length-word.length)*0.06;
    if(s>=minScore)scored.push({d:x,s:s})}
  scored.sort(function(a,b){return b.s-a.s});
  return scored.slice(0,k).map(function(x){return x.d});
}
/* 把 "n. 山谷, 溪谷；v. 跨越" 拆成义项词条：['山谷','溪谷','跨越']（去掉词性前缀） */
function meaningTokens(zh){
  var parts=String(zh||'').split(/[；;，,、\/|\s]+/),out=[];
  for(var i=0;i<parts.length;i++){
    var t=parts[i].replace(/^[a-z]{1,6}\.\s*/i,'').replace(/^(名词|动词|形容词|副词|介词|代词|连词|数词|冠词|助动词|感叹词|缩写)/,'').trim();
    if(t)out.push(t);
  }
  return out;
}
/* 过于通用的单字义项，不足以判定“意思相近” */
var MEAN_STOP={的:1,地:1,得:1,之:1,其:1,以:1,及:1,等:1,是:1,在:1,有:1,和:1,与:1,或:1,使:1,让:1,做:1,给:1,把:1,被:1,了:1,着:1,过:1,个:1,人:1,物:1,事:1};
/* 判断两个词的中文释义是否“意思相近”（共享义项，或义项互为包含且长度≥2） */
function sameMeaning(a,b){
  if(!a||!b)return false;
  var A=meaningTokens(a),B=meaningTokens(b),set={},i,j;
  if(!A.length||!B.length)return false;
  for(i=0;i<A.length;i++)set[A[i]]=1;
  for(i=0;i<B.length;i++){
    var t=B[i];
    if(t.length>=2&&set[t])return true;
    if(t.length===1&&set[t]&&!MEAN_STOP[t])return true;
  }
  for(i=0;i<A.length;i++){
    if(A[i].length<2)continue;
    for(j=0;j<B.length;j++){
      if(B[j].length>=2&&(A[i].indexOf(B[j])>=0||B[j].indexOf(A[i])>=0))return true;
    }
  }
  return false;
}
/* 英译汉选项只显示前几个义项，完整释义留到解析里。
   优先选用与单词「主词性」一致的那组义项，且只取最常用的前两个，避免显示生僻义。 */
function posTagOf(pos){return {noun:'n',verb:'v',adjective:'a',adverb:'adv',preposition:'prep',pronoun:'pron',conjunction:'conj',number:'num',article:'art',auxiliary:'aux',interjection:'int',abbreviation:'abbr',plural:'n'}[(pos||'').toLowerCase()]||''}
function meaningGroups(zh){
  return String(zh||'').split(/[；;]/).map(function(g){
    var m=g.match(/^\s*([a-z]{1,6})\.\s*/i);
    return {pos:m?m[1].toLowerCase():'',text:g.replace(/^\s*[a-z]{1,6}\.\s*/i,'')};
  }).filter(function(g){return g.text.trim()});
}
function shortMeaning(zh,pos,core){
  /* 优先用 core 当第一义项，再从完整释义里补 1–2 个同类常用义，凑成 2–3 个 */
  var strip=function(x){return String(x||'').replace(/[（(][^）)]*[）)]/g,'').replace(/[【\[][^】\]]*[】\]]/g,'').replace(/<[^>]{0,24}>/g,'')};
  var groups=meaningGroups(zh);
  var firstCore=core?String(core).trim():'';
  var first=firstCore||'';
  var pool=[];
  if(groups.length){
    /* 取前两到三个常用词性组，每组抓一个简短、非模式化的义项 */
    for(var gIdx=0;gIdx<Math.min(3,groups.length);gIdx++){
      var tokens=meaningTokens(strip(groups[gIdx].text));
      for(var tIdx=0;tIdx<tokens.length;tIdx++){
        var tk=tokens[tIdx];
        if(!tk||tk.length>10)continue;
        if(/……|…|\.\.\./.test(tk))continue;
        if(firstCore&&tk===firstCore)continue;   /* 跳过已经当第一义的 core */
        pool.push(tk);break;
      }
    }
  }else{
    meaningTokens(strip(zh)).forEach(function(tk){if(tk.length<=10&&!/……|…|\.\.\./.test(tk))pool.push(tk)});
  }
  var seen={};seen[first]=1;
  var extra=[];
  for(var i=0;i<pool.length&&extra.length<2;i++){
    if(!pool[i]||seen[pool[i]])continue;
    extra.push(pool[i]);seen[pool[i]]=1;
  }
  if(!first&&!extra.length)return String(zh||'').slice(0,10);
  var out=(first?[first]:[]).concat(extra).slice(0,3);
  /* 如果只有 1 个，还是退回 core/单义本身（不强行补，避免把毫不相干的词义塞进选项） */
  if(out.length===1)return out[0];

/* 生成 4 个选项：英译汉=精简中文释义；汉译英=英文单词。
   汉译英高难度优先用“词形相近但意思不相近”的词做干扰项（如 possess/propose/proper/proposal）。 */
/* 同词根：前 4 个字母相同视为同源（produce / product / productive），用作「易混」干扰项 */
function wordRoot(w){return String(w||'').toLowerCase().slice(0,4)}
function sameRoot(a,b){var r=wordRoot(a);return r.length===4&&r===wordRoot(b)}
/* 按个人错误历史挑选干扰项：优先拿「自己常错的词」当易混项（错误次数多者靠前） */
function troubleWords(d){
  var out=[],ws=state.words||{};
  Object.keys(ws).forEach(function(k){
    if(k===d.w)return;var x=MAP[k];if(!x)return;
    var err=(ws[k].meaningWrong||0)+(ws[k].productionWrong||0)+(ws[k].errStreak||0);
    if(err<=0)return;
    if(Math.abs((x.baseLv||5)-(d.baseLv||5))>1)return;
    out.push({x:x,err:err});

  out.sort(function(a,b){return b.err-a.err});

function buildOptions(d,md){

  used[d.w]=1;
  /* ---------- en2zh：按难度分档打分选干扰项 ---------- */
  if(md==='en2zh'){
    var lv=+d.baseLv||5,band=bandOf(lv);
    var low=lv<=3,mid=lv>=4&&lv<=6,high=lv>=7;
    /* 先从 session ctx 里拿本轮已出现过的词 Set（同一张卡不重复，也不跨卡重复） */
    var seen=(session&&session.ctx&&session.ctx.__seenEn2zh)||(session.ctx.__seenEn2zh=new Set());
    seen.add(d.w);
    /* 候选池：同 band 全部 + 相邻 baseLv 各 ±1 + 形近 + 同词根 + 个人错题

  if(!cards)return 'lost';

  if(s<7800000)return 'B-';
  if(s<8100000)return 'B';
  if(s<8500000)return 'B+';
  if(s<9000000)return 'A-';

/* Potential 增长曲线（SVG，最近 N 天） */
function pttChartHtml(){
  var h=(state.pttHistory||[]).slice(-30);
  if(h.length<2)return '<div class="tiny">学习满两天后，这里会显示 Potential 增长曲线。</div>';
  var W=300,H=92,pad=8;
  var vals=h.map(function(x){return +x.v||0});
  var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  if(mx-mn<1e-6)mx=mn+1;
  var n=vals.length,coords=vals.map(function(v,i){
    var x=pad+(W-2*pad)*(n<=1?0:i/(n-1));
    var y=H-pad-(H-2*pad)*((v-mn)/(mx-mn));
    return [x,y];
  });
  var line=coords.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var area=pad+','+(H-pad)+' '+line+' '+(W-pad)+','+(H-pad);
  var last=coords[n-1],up=vals[n-1]>=vals[0],col=up?'#53e0a0':'#ff8383';
  var grid='';
  for(var g=0;g<=2;g++){var gy=(pad+(H-2*pad)*(g/2)).toFixed(1);grid+='<line x1="'+pad+'" y1="'+gy+'" x2="'+(W-pad)+'" y2="'+gy+'" stroke="#1e242e" stroke-width="1"/>'}
  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" class="chart">'+
    grid+
    '<polygon points="'+area+'" fill="rgba(79,140,255,.10)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="'+col+'"/>'+
    '</svg>'+
    '<div class="chart-foot"><span>'+escapeHtml(h[0].d)+' · '+vals[0].toFixed(4)+'</span><span>近 '+n+' 天</span><span>'+escapeHtml(h[n-1].d)+' · '+vals[n-1].toFixed(4)+'</span></div>'+
    '</div>';
}
/* 掌握度预测：按近期平均增速估算达到目标 PTT 所需天数 */
function forecastHtml(cur){
  var h=(state.pttHistory||[]);
  if(h.length<2)return '<div class="tiny">数据不足：至少学习两天后生成预测。</div>';
  var win=h.slice(-14);
  var a=win[0],b=win[win.length-1];
  var span=diffDays(a.d,b.d);if(span<1)span=win.length-1;
  var rate=(b.v-a.v)/Math.max(1,span);
  var target=Math.max(5,Math.floor(cur)+1);
  var rateTxt='近 '+Math.max(1,span)+' 天平均 <b>'+(rate>=0?'+':'')+rate.toFixed(4)+' / 天</b>';
  var body;
  if(rate<=0.00005){
    body='曲线持平或回落。先稳住每日复习（把到期词清完）再谈增长。';
  }else{
    var days=Math.ceil((target-cur)/rate);
    body='按此速度，预计 <b>'+days.toLocaleString()+' 天</b>后达到 <b>'+target.toFixed(4)+'</b>（约 '+addDays(today(),days)+'）。';
  }
  return '<div class="tiny">当前 Potential <b>'+cur.toFixed(4)+'</b> · '+rateTxt+'<br>'+body+'</div>';
}

/* 如果某个 action 当前的绑定键已被别的 action 占用，返回那个 action 的名字 */
function occupiedByKey(hk,action){
  var me=(hk[action]||'').toLowerCase();if(!me)return null;
  for(var k in hk){if(k!==action&&(hk[k]||'').toLowerCase()===me)return k}
  return null;
}
function startRecordHotkey(action,btn){
  _hkRecordingAction=action;
  var oldText=btn.textContent;
  btn.textContent='请按键…';btn.classList.add('on');
  function onKey(e){
    e.preventDefault();e.stopPropagation();
    var act=_hkRecordingAction;
    btn.classList.remove('on');
    _hkRecordingAction=null;
    document.removeEventListener('keydown',onKey,true);
    if(!act)return;
    if(e.key==='Escape'){btn.textContent=oldText;toast('已取消录制');return}
    if(e.key==='F5'||(e.ctrlKey&&e.key.toLowerCase()==='r')){btn.textContent=oldText;toast('请不要绑定会刷新浏览器的键');return}
    if(e.repeat){btn.textContent=oldText;return}

/* 单条记录的「进度分」：以记忆阶段为主，正确率与练习量为辅，用于合并时择优 */
function recProgress(r){r=r||{};return (r.stage||0)*1e9+((r.correct||0)*1e6)+(r.seen||0)*1e3+((r.last||0)/1e6)}
/* 合并本机与云端两边的存档：逐词取进度更高的一条，每日/总计取较大值，历史去重合并。
   这样多设备各自练习的进度都不会被对方的整份存档覆盖掉。 */
function mergeState(a,b){
  a=normalize(a);b=normalize(b);
  var out=JSON.parse(JSON.stringify(a)),w=out.words;
  Object.keys(b.words||{}).forEach(function(k){
    var r=b.words[k],cur=w[k];
    if(!cur){w[k]=r;return}
    if(recProgress(r)>recProgress(cur))w[k]=r;
  });
  out.days=out.days||{};
  Object.keys(b.days||{}).forEach(function(d){
    var x=out.days[d],y=b.days[d];if(!y)return;
    if(!x){out.days[d]=y;return}
    out.days[d]={answers:Math.max(x.answers||0,y.answers||0),correct:Math.max(x.correct||0,y.correct||0),target:y.target||x.target,done:!!(x.done||y.done)};
  });
  out.totalAnswers=Math.max(a.totalAnswers||0,b.totalAnswers||0);
  out.totalCorrect=Math.max(a.totalCorrect||0,b.totalCorrect||0);
  out.totalSeconds=Math.max(a.totalSeconds||0,b.totalSeconds||0);
  if(b.streak&&((b.streak.last||'')>(a.streak&&a.streak.last||'')))out.streak=Object.assign({},DEFAULT.streak,b.streak);
  var seenR={},rec=[];
  (a.recent||[]).concat(b.recent||[]).forEach(function(x){var k=JSON.stringify(x);if(seenR[k])return;seenR[k]=1;rec.push(x)});
  out.recent=rec.slice(-100);
  var seenP={};out.pttHistory=((a.pttHistory||[]).concat(b.pttHistory||[])).filter(function(x){
    if(!x||!x.d||seenP[x.d])return false;seenP[x.d]=1;return true;
  }).sort(function(p,q){return p.d<q.d?-1:p.d>q.d?1:0}).slice(-400);
  /* 轮次记录：按时间戳去重合并，保留最近 200 轮 */
  var seenRd={},rd=[];
  (a.rounds||[]).concat(b.rounds||[]).forEach(function(x){if(!x||!isFinite(+x.v))return;var k=String(x.at||'');if(k&&seenRd[k])return;if(k)seenRd[k]=1;rd.push({at:+x.at||0,v:+x.v})});
  rd.sort(function(p,q){return p.at-q.at});
  out.rounds=rd.slice(-200);
  /* 谱面：同一谱面取潜力更高的一条 */
  out.charts=out.charts||{};
  Object.keys(b.charts||{}).forEach(function(k){var x=out.charts[k],y=b.charts[k];if(!y)return;if(!x||(y.potential||0)>=(x.potential||0))out.charts[k]=y});
  /* List 成绩：逐条取分数更高 */
  out.lists=out.lists||{};
  Object.keys(b.lists||{}).forEach(function(k){var x=out.lists[k],y=b.lists[k];if(!y)return;if(!x||Number(y.score||0)>=Number(x.score||0))out.lists[k]=y});
  /* 回忆记录：合并去重，保留最近 10 次 */
  var seenC={},rc=[];
  (a.recall||[]).concat(b.recall||[]).forEach(function(x){var k=String((x&&x.at)||JSON.stringify(x));if(seenC[k])return;seenC[k]=1;rc.push(x)});
  rc.sort(function(p,q){return (p.at||0)-(q.at||0)});
  out.recall=rc.slice(-10);
  return out;
}

  var tag=e.target&&e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return; /* 输入框里不劫持答题快捷键 */
  if(e.repeat)return;  /* 长按不要重复触发 */
  if(!session||!session.queue.length){

    for(var oi=1;oi<=4;oi++){

    if(hkHit(e,'hint')){e.preventDefault();hint();return}

    if(hkHit(e,'submit')&&isTypedMode()){e.preventDefault();submitTyped();return}

/* 一次性迁移：为旧存档的词条记录补写归属 List（r.src）。
   共用词归属到「已学词数最多」的所在 List——即用户真正在学的那个 List，
   避免旧数据把没背过的 List 也算进今日待复习。 */
function migrateSrc(){
  var studied={},changed=0;
  Object.keys(LIST_BY_KEY).forEach(function(k){studied[k]=0});
  Object.keys(state.words).forEach(function(w){
    var r=state.words[w];if(!(r&&r.seen>0))return;
    (KEYS_OF[w]||[]).forEach(function(k){if(studied[k]!=null)studied[k]++});
  });
  Object.keys(state.words).forEach(function(w){
    var r=state.words[w];if(!r||r.src)return;
    var ks=KEYS_OF[w]||[];if(!ks.length)return;
    var best=ks[0],bestN=-1;
    ks.forEach(function(k){if(studied[k]>bestN){bestN=studied[k];best=k}});
    r.src=best;changed++;
  });
  if(changed){save();toast('已为 '+changed+' 个单词标记所属 List，修复跨 List 重复复习')}
}
function renderAll(){renderStreak();session=null;showView('home')}
function boot(){
  try{
    if(!WORDS.length)throw new Error('词库为空');
    buildIndex();
    migrateSrc();
    renderStreak();
    showView('home');
    toast('词库已就绪 · '+WORDS.length.toLocaleString()+' 词');
    refreshSyncDot();
    restoreCloud();
    checkReminder();
    if(window.__reminderTimer)clearInterval(window.__reminderTimer);
    window.__reminderTimer=setInterval(checkReminder,300000); /* 每 5 分钟检查一次学习提醒 */
  }catch(e){showError(e)}
}
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredPrompt=e;refreshInstallBtn();
});
window.addEventListener('appinstalled',function(){deferredPrompt=null;refreshInstallBtn();toast('已安装为桌面应用')});
function registerSW(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol!=='http:'&&location.protocol!=='https:')return;
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
boot();
registerSW();
};
</script>
<script>
/* 词库与代码分离：数据在 words.json，加载完成后再启动应用 */
(function(){
  var ld=document.createElement('div');
  ld.textContent='词库加载中…';
  ld.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#9fb0c6;font-size:14px;background:#090a0d;z-index:50';
  document.body.appendChild(ld);
  function fail(msg){
    var box=document.getElementById('errorBox');
    if(box){box.textContent=msg;box.classList.remove('hidden')}
    if(ld&&ld.parentNode)ld.parentNode.removeChild(ld);
  }
  fetch('words.json').then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    window.WORDS_BANK=(d&&d.words)||[];
    window.EXAM_LISTS=(d&&d.examLists)||[];
    if(!window.WORDS_BANK.length)throw new Error('词库为空');
    if(ld&&ld.parentNode)ld.parentNode.removeChild(ld);
    window.__startApp();
  }).catch(function(e){
    var m=(e&&e.message)||e;
    fail('词库加载失败：'+m+'。请通过 http(s) 访问（本地可运行 python3 -m http.server 8080），并确认 words.json 存在。');
  });
})();
</script>
